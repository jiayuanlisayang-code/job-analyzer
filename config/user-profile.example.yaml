# 用户画像配置 — 不会被上传到 GitHub
# 可选高级用法：复制此文件为 user-profile.yaml 并填入你的信息
# Skill 也可以在聊天中收集画像；如果 user-profile.yaml 存在，阶段零会优先读取

# ─── 必填字段 ──────────────────────────────
work_background: "在此填写：行业、年限、具体产品/模块"
education: "在此填写：学校级别（985/211/海归）、专业、学位"
target_role: "在此填写：目标岗位，例如 AI产品经理 / 数据分析师 / 增长产品经理"

# ─── 选填字段（不填则运行时询问）────────────
target_industry: ""
company_preference: ""     # 选项: foreign_big_tech / internet_giant / industry_unicorn / remote
work_location: ""          # 城市名 或 "remote"
experience_years: ""       # 总工作年限
ai_skill_level: ""         # none / beginner / intermediate / advanced
language: "zh"             # zh / en / bilingual
