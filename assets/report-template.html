<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{report_title}}</title>
<style>
  :root {
    --bg: #ffffff; --card: #f8f9fa; --border: #e0e0e0;
    --text: #1a1a2e; --text2: #4a4a5a; --text3: #6b7280;
    --accent: #2563eb; --accent2: #7c3aed; --green: #059669;
    --orange: #ea580c; --red: #dc2626;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  .container { max-width: 1060px; margin: 0 auto; padding: 32px 24px; }
  
  header { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #7c3aed 100%); color: #fff; padding: 48px 32px; border-radius: 16px; margin-bottom: 36px; }
  header h1 { font-size: 2rem; margin-bottom: 8px; }
  header .sub { opacity: 0.85; font-size: 0.95rem; }
  header .meta { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 0.85rem; opacity: 0.8; }
  
  h2 { font-size: 1.4rem; margin: 40px 0 16px; padding-bottom: 8px; }
  h3 { font-size: 1.15rem; margin: 28px 0 14px; display: flex; align-items: center; gap: 10px; }
  
  .tier-badge { display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .tier-1 { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #f59e0b; }
  .tier-2 { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color: #3730a3; border: 1px solid #6366f1; }
  .tier-3 { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; border: 1px solid #10b981; }
  .tier-4 { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); color: #6b21a8; border: 1px solid #a855f7; }

  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .summary-card { background: var(--card); border-radius: 12px; padding: 18px; border-left: 4px solid var(--accent); }
  .summary-card .num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .summary-card .label { font-size: 0.82rem; color: var(--text3); margin-top: 2px; }
  
  table { width: 100%; border-collapse: collapse; margin: 16px 0 24px; font-size: 0.88rem; }
  th { background: #1e3a5f; color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:nth-child(even) td { background: #f8fafc; }
  tr:hover td { background: #eff6ff; }
  
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin: 2px; }
  .tag-blue { background: #eff6ff; color: #1d4ed8; }
  .tag-green { background: #ecfdf5; color: #059669; }
  .tag-orange { background: #fff7ed; color: #ea580c; }
  .tag-purple { background: #f5f3ff; color: #7c3aed; }
  .tag-teal { background: #e0f2fe; color: #0891b2; }
  .tag-gold { background: #fef3c7; color: #92400e; }
  
  .skill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin: 16px 0 24px; }
  .skill-card { background: var(--card); border-radius: 12px; padding: 18px; border: 1px solid var(--border); }
  .skill-card h4 { color: var(--accent); margin-bottom: 8px; font-size: 0.95rem; }
  .skill-card ul { padding-left: 18px; color: var(--text2); font-size: 0.85rem; }
  .skill-card li { margin-bottom: 3px; }
  
  .gap-box { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 20px 24px; margin: 16px 0; }
  .gap-box h4 { color: var(--orange); margin-bottom: 8px; }
  .strength-box { background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 12px; padding: 20px 24px; margin: 16px 0; }
  .strength-box h4 { color: var(--green); margin-bottom: 8px; }
  
  .action-steps { counter-reset: step; list-style: none; padding: 0; }
  .action-steps li { counter-increment: step; margin-bottom: 16px; padding: 16px 20px 16px 56px; background: var(--card); border-radius: 10px; position: relative; }
  .action-steps li::before { content: counter(step); position: absolute; left: 16px; top: 16px; width: 28px; height: 28px; background: var(--accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; }
  
  .job-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; transition: box-shadow 0.2s; position: relative; }
  .job-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .job-card .company-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .job-card .company-row strong { font-size: 1.05rem; color: var(--text); }
  .job-card .title { font-size: 0.95rem; color: var(--accent); margin: 4px 0; }
  .job-card .meta-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; color: var(--text3); font-size: 0.83rem; }
  .job-card .reqs { margin-top: 8px; font-size: 0.83rem; color: var(--text2); }
  .job-card .highlight { background: #fef3c7; padding: 1px 5px; border-radius: 3px; }
  .job-link { display: inline-block; font-size: 0.75rem; color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); margin-left: 4px; }
  .job-link:hover { border-bottom-style: solid; }
  
  .rec { border-left: 4px solid var(--accent); background: linear-gradient(135deg, #f8faff, #f0f4ff); }
  .rec-star { border-left: 4px solid #f59e0b; background: linear-gradient(135deg, #fffdf7, #fffbe6); }
  
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--text3); font-size: 0.78rem; text-align: center; }

  @media (max-width: 640px) {
    .container { padding: 14px; }
    header { padding: 24px 18px; }
    header h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>{{report_title}}</h1>
  <div class="sub">{{report_subtitle}}</div>
  <div class="meta">
    <span>📍 {{work_location}}</span>
    <span>数据来源：{{data_sources}}</span>
    <span>分析时间：{{analysis_date}}</span>
  </div>
</header>

<!-- 分析纪要 -->
{{analysis_summary}}

<!-- 数据概览 -->
{{summary_cards}}

<!-- Tier 分层岗位卡片 -->
{{tier_sections}}

<!-- 能力模型 -->
{{skill_model}}

<!-- 差距分析 -->
{{gap_analysis}}

<!-- 行动建议 -->
{{action_plan}}

<!-- 薪资矩阵 -->
{{salary_matrix}}

<!-- 核心结论 -->
{{core_conclusion}}

<footer>
{{footer_text}}
</footer>

</div>
</body>
</html>
